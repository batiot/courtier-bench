[project]
name = "rikees-mcp"
version = "0.1.0"
description = "MCP stub server for Rikees Sol — tarification and portefeuille tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.5.0",
]

[project.scripts]
rikees-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
