services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/gemma-4-E4B-it-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --threads 8
      --ctx-size 4096
      --chat-template gemma
    restart: unless-stopped
    # Limits CPU usage — adjust to your machine
    deploy:
      resources:
        limits:
          memory: 12G
