schema: spec-driven

context: |
  # courtier-bench

  Projet de construction d'un benchmark d'évaluation pour le chatbot "Genia" dans le domaine du courtage en assurance.

  ## Objectif général
  Construire un dataset courtier permettant d'évaluer (scénarios idéal, court et adversarial) le chatbot Genia.
  Identifier les tools métier et la knowledge base (exposés en outils MCP).

  ## Phases du projet
  1. **Collecte d'information** : recherche et organisation des connaissances métier courtage (produits, réglementation, processus, personas clients)
  2. **Génération de conversations** : conversations types (idéal, court, adversarial) basées sur les recherches
  3. **Dataset d'évaluation** : questions/réponses structurées par scénario et domaine
  4. **Serveur MCP de bouchon** : serveur MCP segmenté par domaine, potentiellement paramétrable par persona
  5. **Outillage d'évaluation** : harness pour lancer des runs d'évaluation sur les datasets

  ## Domaines métier courtage (à affiner)
  - ...


  ## Types de scénarios d'évaluation (à affiner)
  - **Idéal** : question claire, intention précise, dans le scope, contexte complet
  - **Réaliste/Court** : fautes de frappe, langage oral, demande vague, contexte partiel
  - **Adversarial** : prompt injection, jailbreak, biais, contournement des règles, hors-scope

  ## Stack technique
  - Python (géré exclusivement avec `uv`)
  - MCP (Model Context Protocol) pour les bouchons de tools
  - YAML pour la définition des tâches d'évaluation et les datasets
  - Gradeurs : LLM-as-judge (Gemma-4-E2B via llama.cpp Docker), human spot-check

  ## Conventions
  - Utiliser `uv` pour toutes les opérations Python (install, run, scripts)
  - Toujours mettre à jour AGENTS.md, README.md et config.yaml si des éléments pertinents méritent d'être ajoutés
  - Structurer les datasets en JSONL avec les champs : id, scenario_family, domain, input, expected, expected_matches
  - Format des fichiers de runs : JSONL nommé `run_YYYYMMDD_HHMMSS.jsonl` dans `runs/`
  - Les tâches d'évaluation suivent la structure Anthropic : task, graders, tracked_metrics

  ## Références
  - docs/reference/eval.md — Talk Devoxx France 2026 "Mesurer l'immesurable" par Erin Pacquetet (SCIAM)
  - https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents

  ## Fichiers docs/
  - docs/courtier-personas.md — 6 personas représentatifs de courtiers français susceptibles d'utiliser l'Espace partenaire Rikees Sol ; référence pour la génération de scénarios d'évaluation
  - docs/coverage-scope.md — Périmètres de couverture des produits Rikees Sol : garanties, profils éligibles, exclusions et options de modularité
  - docs/espace-partenaire-interactions.md — Cartographie des univers accessibles et des interactions fonctionnelles réalisables par un courtier depuis l'Espace partenaire Rikees Sol
  - docs/offer-categorization.md — Taxonomie des offres disponibles dans l'Espace partenaire Rikees Sol (lignes de produits, catégories)
  - docs/offre-Rikees.md — Vue d'ensemble des offres et solutions B2B de Rikees pour les courtiers (positionnement, entités, écosystème)
  - docs/relation-b2b-courtierr.md — Interactions clés d'un courtier français avec les SI de grossistes, assureurs et solutions B2B (cotation, souscription, sinistres, CRM, conformité…)
  - docs/reference/eval.md — Notes du talk Devoxx France 2026 sur l'évaluation des systèmes GenAI, utilisées comme référence méthodologique

rules:
  proposal:
    - Inclure systématiquement les trois types de scénarios (idéal, court, adversarial)
    - Préciser le domaine métier concerné
    - Identifier les tools MCP impliqués
    - Indiquer la méthode de grading recommandée
  tasks:
    - Découper en étapes de max 2h
    - Préciser la phase du projet (collecte / génération / dataset / MCP / évaluation)
    - Indiquer si la tâche impacte AGENTS.md, README.md ou config.yaml
  spec:
    - Définir les critères de succès avant l'implémentation (eval-driven development)
    - Toujours associer une tâche à un grader explicite
    - Documenter les personas utilisées pour paramétrer le MCP
